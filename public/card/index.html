<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>דיאנה | LADY DIAMOND תכשיטים</title>
<meta name="description" content="כרטיס ביקור של דיאנה, LADY DIAMOND תכשיטי יוקרה משנת 2010. טלפון, אימייל וכתובת.">
<link rel="stylesheet" href="fonts.css">
<style>
  /* Layout: one 3D card centred on a dark stage; tilts with the pointer, flips front to back. */
  :root {
    --ink: #07060a;          /* stage black, faint violet bias */
    --onyx: #100e14;         /* card face */
    --gold: #d7b46a;         /* main gold */
    --gold-hi: #f6e3b0;      /* highlight gold */
    --gold-lo: #8a6a2c;      /* shadow gold */
    --mist: #b9b2a3;         /* secondary text, warm grey */
    --display: "Frank Ruhl Libre", "David Libre", Georgia, serif;
    --latin: "Cormorant Garamond", Georgia, serif;
    --body: "Heebo", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: var(--ink);
    color: var(--gold-hi);
    font-family: var(--body);
    padding-inline: 16px;
    padding-block: 28px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    overflow-x: hidden;
    background-image: radial-gradient(ellipse 70% 50% at 50% 38%, #1d1710 0%, transparent 70%);
  }
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .stage { position: relative; z-index: 1; width: min(94vw, 580px); perspective: 1400px; margin-top: 4vh; }
  .tilt { transform-style: preserve-3d; will-change: transform; }
  .card {
    position: relative; width: 100%; aspect-ratio: 1.75 / 1;
    transform-style: preserve-3d; cursor: pointer; outline: none;
  }
  .card:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 8px; border-radius: 16px; }
  .face, .edge {
    position: absolute; inset: 0; border-radius: 14px;
  }
  .edge { background: linear-gradient(90deg, var(--gold-lo), var(--gold), var(--gold-lo)); }
  .face {
    background:
      linear-gradient(135deg, rgba(246,227,176,.06), transparent 40%),
      var(--onyx);
    border: 1px solid rgba(215,180,106,.55);
    box-shadow: inset 0 0 0 6px var(--onyx), inset 0 0 0 7px rgba(215,180,106,.28);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    overflow: hidden;
    padding: clamp(18px, 5.2%, 30px);
  }
  .face.back { transform: rotateY(180deg); }
  .sheen {
    position: absolute; inset: -40%; pointer-events: none; mix-blend-mode: screen; opacity: .0;
    background: radial-gradient(circle at var(--sx, 50%) var(--sy, 50%), rgba(246,227,176,.55), rgba(215,180,106,.12) 22%, transparent 45%);
  }

  /* front */
  .front-inner { height: 100%; display: grid; grid-template-rows: 1fr auto; position: relative; }
  .gem { position: absolute; inset-inline-start: 0; top: 4%; width: 33%; max-width: 150px; aspect-ratio: 1; transform-style: preserve-3d; }
  .gem svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 6px 18px rgba(215,180,106,.35)); }
  .brand { align-self: center; text-align: end; direction: ltr; padding-inline-start: 38%; }
  .brand .word {
    font-family: var(--latin); font-weight: 600; letter-spacing: .34em; text-transform: uppercase;
    font-size: clamp(20px, 5.6vw, 34px); line-height: 1.05;
    background: linear-gradient(100deg, var(--gold-lo) 0%, var(--gold-hi) 40%, var(--gold) 60%, var(--gold-lo) 100%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .word span { display: block; }
  .brand .est { font-family: var(--latin); font-size: clamp(10px, 2.6vw, 13px); letter-spacing: .5em; color: var(--mist); margin-top: 10px; text-transform: uppercase; }
  .who { direction: rtl; border-top: 1px solid rgba(215,180,106,.35); padding-top: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .who .name { font-family: var(--display); font-weight: 500; font-size: clamp(20px, 5.4vw, 30px); color: var(--gold-hi); }
  .who .role { font-size: clamp(11px, 2.8vw, 13px); letter-spacing: .08em; color: var(--mist); font-weight: 300; }

  /* back */
  .back-inner { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: clamp(7px, 2.2vw, 13px); direction: rtl; }
  .row { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; min-width: 0; }
  .row svg { width: 18px; height: 18px; stroke: var(--gold); fill: none; stroke-width: 1.4; }
  .row .val { font-size: clamp(12px, 3.3vw, 15.5px); color: var(--gold-hi); font-weight: 300; min-width: 0; overflow-wrap: anywhere; }
  .row .val bdi { direction: ltr; unicode-bidi: isolate; letter-spacing: .02em; }
  .copy {
    font: 400 11px var(--body); letter-spacing: .08em; color: var(--gold); background: transparent;
    border: 1px solid rgba(215,180,106,.45); border-radius: 999px; padding: 3px 10px; cursor: pointer;
  }
  .copy:hover { background: rgba(215,180,106,.12); }
  .copy:focus-visible, .btn:focus-visible, .links a:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }

  /* controls under the card */
  .under { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; width: min(94vw, 580px); }
  .hint { font-size: 12px; letter-spacing: .14em; color: var(--mist); text-align: center; }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .btn, .links a {
    font: 500 13.5px var(--body); letter-spacing: .06em; text-decoration: none; cursor: pointer;
    color: var(--ink); background: linear-gradient(120deg, var(--gold-hi), var(--gold) 55%, #b98f45);
    border: 0; border-radius: 999px; padding: 11px 22px; transition: transform .2s, box-shadow .2s;
    box-shadow: 0 6px 22px rgba(215,180,106,.18);
  }
  .links a.ghost, .btn.ghost { background: transparent; color: var(--gold); border: 1px solid rgba(215,180,106,.55); box-shadow: none; }
  .btn:hover, .links a:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(215,180,106,.28); }
  .toast { min-height: 18px; font-size: 12.5px; color: var(--gold-hi); letter-spacing: .06em; }

  @media (prefers-reduced-motion: reduce) { .btn, .links a { transition: none; } }
</style>

</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>

<main class="stage">
  <div class="tilt" id="tilt">
    <div class="card" id="card" role="button" tabindex="0" aria-label="כרטיס ביקור של דיאנה, לחצו כדי להפוך">
      <div class="edge" style="transform: translateZ(-1px)"></div>
      <div class="edge" style="transform: translateZ(-2px)"></div>
      <div class="edge" style="transform: translateZ(-3px)"></div>
      <div class="edge" style="transform: translateZ(-4px)"></div>
      <div class="edge" style="transform: translateZ(-5px)"></div>

      <section class="face front" id="front">
        <div class="front-inner">
          <div class="gem" id="gem" aria-hidden="true">
            <svg viewBox="0 0 120 120" role="presentation">
              <defs>
                <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e3b0"/><stop offset="1" stop-color="#8a6a2c"/></linearGradient>
                <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7b46a"/><stop offset="1" stop-color="#5d4519"/></linearGradient>
                <linearGradient id="g3" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fff3cf"/><stop offset="1" stop-color="#c9a458"/></linearGradient>
              </defs>
              <polygon class="f" points="30,22 90,22 110,46 10,46" fill="url(#g1)"/>
              <polygon class="f" points="10,46 110,46 60,108" fill="url(#g2)"/>
              <polygon class="f" points="30,22 45,46 60,22" fill="url(#g3)" opacity=".9"/>
              <polygon class="f" points="60,22 75,46 90,22" fill="url(#g3)" opacity=".75"/>
              <polygon class="f" points="45,46 60,108 28,46" fill="#fff" opacity=".12"/>
              <polygon class="f" points="75,46 92,46 60,108" fill="#000" opacity=".18"/>
              <path d="M10 46 L30 22 L90 22 L110 46 L60 108 Z M10 46 H110 M45 46 L60 22 L75 46 M45 46 L60 108 L75 46" fill="none" stroke="#fff3cf" stroke-opacity=".55" stroke-width=".8"/>
            </svg>
          </div>
          <div class="brand">
            <div class="word" id="word"><span>Lady</span><span>Diamond</span></div>
            <div class="est">Fine Jewelry · Since 2010</div>
          </div>
          <div class="who">
            <span class="name">דיאנה</span>
            <span class="role">תכשיטי יוקרה משנת 2010</span>
          </div>
        </div>
        <div class="sheen"></div>
      </section>

      <section class="face back" id="back">
        <div class="back-inner">
          <div class="row">
            <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
            <span class="val"><bdi>+972-50-3781589</bdi></span>
            <button class="copy" data-copy="+972-50-3781589" type="button">העתקה</button>
          </div>
          <div class="row">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <span class="val"><bdi>diana@ladydiamondjewels.com</bdi></span>
            <button class="copy" data-copy="diana@ladydiamondjewels.com" type="button">העתקה</button>
          </div>
          <div class="row">
            <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span class="val">מתחם בורסה, בניין נועם, רחוב תובל 23, רמת גן</span>
            <button class="copy" data-copy="מתחם בורסה, בניין נועם, רחוב תובל 23, רמת גן" type="button">העתקה</button>
          </div>
          <div class="row">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span class="val">ראשון עד חמישי, 9:00 עד 19:00</span>
            <span></span>
          </div>
          <div class="row">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
            <span class="val"><bdi>ladydiamondjewels.com</bdi></span>
            <button class="copy" data-copy="https://ladydiamondjewels.com" type="button">העתקה</button>
          </div>
        </div>
        <div class="sheen"></div>
      </section>
    </div>
  </div>
</main>

<div class="under">
  <div class="links">
    <a href="https://wa.me/972503781589" target="_blank" rel="noopener">שליחת הודעה בוואטסאפ</a>
    <a class="ghost" href="https://ladydiamondjewels.com/" target="_blank" rel="noopener">לאתר החנות</a>
    <a class="ghost" href="https://www.facebook.com/share/1DvujJtBMS/" target="_blank" rel="noopener">פייסבוק</a>
  </div>
  <button class="btn ghost" id="flip" type="button">הפיכת הכרטיס</button>
  <div class="hint">הזיזו את העכבר מעל הכרטיס · לחיצה הופכת אותו</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="gsap.min.js"></script>
<script>
(function () {
  var card = document.getElementById('card');
  var tilt = document.getElementById('tilt');
  var gem = document.getElementById('gem');
  var toast = document.getElementById('toast');
  var sheens = document.querySelectorAll('.sheen');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var flipped = false;
  var hasG = !!window.gsap;

  /* gold dust canvas: slow rising specks, drawn once per frame */
  var cv = document.getElementById('dust'), cx = cv.getContext('2d'), W = 0, H = 0, dots = [];
  function size() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  size(); addEventListener('resize', size);
  for (var i = 0; i < 46; i++) dots.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .3, v: Math.random() * .00006 + .00002, a: Math.random() * .5 + .15 });
  function dust() {
    cx.clearRect(0, 0, W, H);
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i]; d.y -= d.v * 16; if (d.y < -.02) { d.y = 1.02; d.x = Math.random(); }
      cx.beginPath(); cx.arc(d.x * W, d.y * H, d.r, 0, 6.283); cx.fillStyle = 'rgba(215,180,106,' + d.a + ')'; cx.fill();
    }
    if (!reduce) requestAnimationFrame(dust);
  }
  dust();

  function setFlip(v, instant) {
    flipped = v;
    var target = v ? 180 : 0;
    if (hasG && !instant) gsap.to(card, { rotationY: target, duration: 1.1, ease: 'power3.inOut' });
    else if (hasG) gsap.set(card, { rotationY: target });
    else card.style.transform = 'rotateY(' + target + 'deg)';
  }
  card.addEventListener('click', function (e) { if (e.target.closest('.copy')) return; setFlip(!flipped); });
  card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setFlip(!flipped); } });
  document.getElementById('flip').addEventListener('click', function () { setFlip(!flipped); });

  /* copy buttons */
  var timer;
  function say(msg) { toast.textContent = msg; clearTimeout(timer); timer = setTimeout(function () { toast.textContent = ''; }, 2200); }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); return ok;
  }
  document.querySelectorAll('.copy').forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      var t = b.getAttribute('data-copy');
      var done = function (ok) { say(ok ? 'הועתק: ' + t : 'אפשר לסמן ולהעתיק ידנית'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { done(true); }, function () { done(fallbackCopy(t)); });
      else done(fallbackCopy(t));
    });
  });

  if (!hasG) return; /* page is complete and readable without GSAP */

  /* entrance: the card drops in and settles, the wordmark's gold sweeps across, facets light one by one */
  var facets = gem.querySelectorAll('.f');
  if (!reduce) {
    var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
    tl.from(tilt, { y: -120, rotationX: 38, rotationZ: -6, opacity: 0, duration: 1.4, ease: 'expo.out' })
      .from(facets, { opacity: 0, scale: .6, transformOrigin: '50% 50%', stagger: .09, duration: .7 }, '-=.8')
      .fromTo('#word', { backgroundPosition: '120% 0' }, { backgroundPosition: '-20% 0', duration: 2.2, ease: 'power2.inOut' }, '-=.9')
      .from('.who', { y: 14, opacity: 0, duration: .8 }, '-=1.6')
      .from('.under > *', { y: 18, opacity: 0, stagger: .1, duration: .7 }, '-=.8');

    /* idle: slow float and a turning gem so the card never looks static */
    gsap.to(tilt, { y: -8, duration: 3.4, yoyo: true, repeat: -1, ease: 'sine.inOut', delay: 2 });
    gsap.to(gem, { rotationY: 360, duration: 14, repeat: -1, ease: 'none' });
    gsap.to('#word', { backgroundPosition: '-20% 0', duration: 6, yoyo: true, repeat: -1, ease: 'sine.inOut', delay: 3.5 });
  }

  /* pointer tilt with a gold sheen that follows the light */
  var rx = gsap.quickTo(tilt, 'rotationX', { duration: .6, ease: 'power3.out' });
  var ry = gsap.quickTo(tilt, 'rotationY', { duration: .6, ease: 'power3.out' });
  var stage = document.querySelector('.stage');
  function move(e) {
    var b = stage.getBoundingClientRect();
    var px = (e.clientX - b.left) / b.width, py = (e.clientY - b.top) / b.height;
    var cxn = Math.max(-1, Math.min(1, (px - .5) * 2)), cyn = Math.max(-1, Math.min(1, (py - .5) * 2));
    ry(cxn * 16); rx(-cyn * 12);
    sheens.forEach(function (s) { s.style.setProperty('--sx', (px * 100) + '%'); s.style.setProperty('--sy', (py * 100) + '%'); });
  }
  function enter() { if (!reduce) gsap.to(sheens, { opacity: .55, duration: .4 }); }
  function leave() { rx(0); ry(0); gsap.to(sheens, { opacity: 0, duration: .6 }); }
  if (!reduce) {
    stage.addEventListener('pointermove', move);
    stage.addEventListener('pointerenter', enter);
    stage.addEventListener('pointerleave', leave);
  }
})();
</script>

</body>
</html>
